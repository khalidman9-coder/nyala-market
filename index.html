<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#111827">

<title>بورصة نيالا</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 14px;
    font-family: Arial, Tahoma, sans-serif;
    background: #f3f5f7;
    color: #17202a;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
}

/* =========================
   Header
========================= */

.header {
    background: linear-gradient(
        135deg,
        #111827,
        #26364d
    );

    color: white;

    text-align: center;

    padding: 25px 18px;

    border-radius: 22px;

    margin-bottom: 14px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.12);
}

.header h1 {
    margin: 0;

    font-size: 28px;

    font-weight: 800;
}

.header p {
    margin: 8px 0 0;

    color: #d1d5db;

    font-size: 14px;
}


/* =========================
   Status
========================= */

.status {
    background: white;

    border-radius: 15px;

    padding: 12px;

    text-align: center;

    margin-bottom: 14px;

    font-size: 13px;

    color: #555;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.05);
}


/* =========================
   Cards
========================= */

.card {
    background: white;

    border-radius: 20px;

    padding: 19px;

    margin-bottom: 14px;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,.07);
}

.card-title {
    font-size: 20px;

    font-weight: 800;

    margin-bottom: 17px;

    display: flex;

    align-items: center;

    gap: 8px;
}


/* =========================
   Gold / Dollar
========================= */

.price-row {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 13px 0;

    border-bottom:
        1px solid #edf0f2;
}

.price-row:last-child {
    border-bottom: none;
}

.label {
    color: #6b7280;

    font-size: 15px;
}

.value {
    font-size: 21px;

    font-weight: 800;

    color: #111827;
}


/* =========================
   Fuel cards
========================= */

.fuel-grid {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;
}

.fuel-box {
    background: #f8fafc;

    border: 1px solid #edf0f2;

    border-radius: 16px;

    padding: 16px;

    text-align: center;
}

.fuel-name {
    font-size: 15px;

    color: #6b7280;

    margin-bottom: 8px;
}

.fuel-price {
    font-size: 22px;

    font-weight: 800;

    color: #111827;
}


/* =========================
   Last update
========================= */

.update {
    background: white;

    border-radius: 17px;

    padding: 15px;

    text-align: center;

    margin-bottom: 14px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.05);

    color: #6b7280;

    font-size: 13px;
}

.update strong {
    color: #111827;
}


/* =========================
   Refresh button
========================= */

.refresh-btn {
    width: 100%;

    border: none;

    background: #111827;

    color: white;

    border-radius: 15px;

    padding: 14px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}

.refresh-btn:active {
    transform: scale(.98);
}


/* =========================
   Footer
========================= */

.footer {
    text-align: center;

    color: #9ca3af;

    font-size: 11px;

    padding: 10px 0 25px;
}


/* =========================
   Mobile
========================= */

@media (max-width: 360px) {

    body {
        padding: 10px;
    }

    .header h1 {
        font-size: 24px;
    }

    .value {
        font-size: 19px;
    }

    .fuel-price {
        font-size: 20px;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- =========================
     Header
========================= -->

<div class="header">

    <h1>بورصة نيالا</h1>

    <p>
        أسعار السوق الآن
    </p>

</div>


<!-- =========================
     Status
========================= -->

<div
    id="status"
    class="status">

    جاري تحميل الأسعار...

</div>


<!-- =========================
     Gold
========================= -->

<div class="card">

    <div class="card-title">

        🥇 الذهب

    </div>


    <div class="price-row">

        <span class="label">
            شراء
        </span>

        <span
            id="goldBuy"
            class="value">

            ---

        </span>

    </div>


    <div class="price-row">

        <span class="label">
            بيع
        </span>

        <span
            id="goldSell"
            class="value">

            ---

        </span>

    </div>

</div>


<!-- =========================
     Dollar
========================= -->

<div class="card">

    <div class="card-title">

        💵 الدولار

    </div>


    <div class="price-row">

        <span class="label">
            شراء
        </span>

        <span
            id="dollarBuy"
            class="value">

            ---

        </span>

    </div>


    <div class="price-row">

        <span class="label">
            بيع
        </span>

        <span
            id="dollarSell"
            class="value">

            ---

        </span>

    </div>

</div>


<!-- =========================
     Fuel
========================= -->

<div class="card">

    <div class="card-title">

        ⛽ الوقود

    </div>


    <div class="fuel-grid">


        <div class="fuel-box">

            <div class="fuel-name">
                ديزل
            </div>

            <div
                id="diesel"
                class="fuel-price">

                ---

            </div>

        </div>


        <div class="fuel-box">

            <div class="fuel-name">
                بنزين
            </div>

            <div
                id="gasoline"
                class="fuel-price">

                ---

            </div>

        </div>


    </div>

</div>


<!-- =========================
     Last update
========================= -->

<div class="update">

    آخر تحديث:

    <strong
        id="lastUpdate">

        ---

    </strong>

</div>


<!-- =========================
     Refresh
========================= -->

<button
    class="refresh-btn"
    onclick="loadPrices()">

    🔄 تحديث الأسعار

</button>

<a
    href="/chart.html"
    class="refresh-btn"
    style="display:block; text-align:center; text-decoration:none; margin-top:10px;">

    📊 تحليل حركة الأسعار

</a>


<div class="footer">

    بورصة نيالا © 2026

</div>


</div>


<script>

/* =========================
   تحميل الأسعار
========================= */

async function loadPrices() {

    const status =
        document.getElementById(
            "status"
        );


    try {

        status.textContent =
            "جاري تحميل الأسعار...";


        const response =
            await fetch(
                "/prices.txt?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        const lines =
            text.split(/\r?\n/);


        const prices = {};


        lines.forEach(
            function(line) {

                const index =
                    line.indexOf(":");


                if (index === -1) {
                    return;
                }


                const key =
                    line
                    .substring(
                        0,
                        index
                    )
                    .trim();


                const value =
                    line
                    .substring(
                        index + 1
                    )
                    .trim();


                prices[key] =
                    value;

            }
        );


        /* الذهب */

        document.getElementById(
            "goldBuy"
        ).textContent =
            prices["Gold BUY"] ||
            "---";


        document.getElementById(
            "goldSell"
        ).textContent =
            prices["Gold SELL"] ||
            "---";


        /* الدولار */

        document.getElementById(
            "dollarBuy"
        ).textContent =
            prices["Dollar BUY"] ||
            "---";


        document.getElementById(
            "dollarSell"
        ).textContent =
            prices["Dollar SELL"] ||
            "---";


        /* الديزل */

        document.getElementById(
            "diesel"
        ).textContent =
            prices["Diesel"] ||
            "---";


        /* البنزين */

        document.getElementById(
            "gasoline"
        ).textContent =
            prices["Gasoline"] ||
            "---";


        /* آخر تحديث */

        document.getElementById(
            "lastUpdate"
        ).textContent =
            prices["Last update"] ||
            "---";


        status.textContent =
            "● الأسعار محدثة";


    }

    catch (error) {

        console.error(error);


        status.textContent =
            "تعذر تحميل الأسعار";

    }

}


/* =========================
   التحميل الأول
========================= */

loadPrices();


/* =========================
   تحديث تلقائي كل 30 ثانية
========================= */

setInterval(
    loadPrices,
    30000
);

</script>


</body>

</html>
