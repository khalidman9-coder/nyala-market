<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بورصة نيالا</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f4f6f8;
    color: #17202a;
}

/* =========================
   الصفحة
========================= */

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 14px;
}

/* =========================
   الهيدر
========================= */

.header {
    background: linear-gradient(135deg, #111827, #26364d);
    color: white;
    padding: 24px 18px;
    border-radius: 22px;
    margin-bottom: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    width: 48px;
    height: 48px;
    background: rgba(255,255,255,0.12);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
}

.header h1 {
    margin: 0;
    font-size: 25px;
}

.header p {
    margin: 8px 0 0;
    color: #d1d5db;
    font-size: 14px;
}

/* =========================
   حالة التحديث
========================= */

.status {
    background: white;
    border-radius: 15px;
    padding: 12px;
    margin-bottom: 14px;
    text-align: center;
    font-size: 14px;
    color: #15803d;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    margin-left: 5px;
}

/* =========================
   البطاقات
========================= */

.card {
    background: white;
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.07);
}

.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.card-title {
    display: flex;
    align-items: center;
    gap: 10px;
}

.icon {
    width: 43px;
    height: 43px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    background: #f3f4f6;
}

.card-title h2 {
    margin: 0;
    font-size: 19px;
}

.card-title span {
    display: block;
    margin-top: 3px;
    font-size: 12px;
    color: #6b7280;
}

/* =========================
   الأسعار
========================= */

.price-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 0;
    border-top: 1px solid #edf0f2;
}

.price-label {
    color: #6b7280;
    font-size: 14px;
}

.price-value {
    font-size: 21px;
    font-weight: bold;
    color: #111827;
}

.currency {
    font-size: 12px;
    color: #6b7280;
    margin-right: 4px;
}

/* =========================
   آخر تحديث
========================= */

.last-update {
    text-align: center;
    color: #6b7280;
    font-size: 12px;
    margin: 18px 0;
}

/* =========================
   زر التحديث
========================= */

.refresh-btn {
    width: 100%;
    border: none;
    background: #111827;
    color: white;
    padding: 15px;
    border-radius: 15px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.refresh-btn:active {
    transform: scale(0.98);
}

.refresh-btn.loading {
    opacity: 0.7;
}

/* =========================
   الفوتر
========================= */

.footer {
    text-align: center;
    color: #9ca3af;
    font-size: 11px;
    padding: 15px 0 25px;
}

</style>
</head>


<body>

<div class="container">

    <!-- =====================
         الهيدر
    ====================== -->

    <div class="header">

        <div class="header-top">

            <div>
                <h1>بورصة نيالا</h1>
                <p>أسعار السوق في نيالا</p>
            </div>

            <div class="logo">
                📊
            </div>

        </div>

    </div>


    <!-- =====================
         حالة الموقع
    ====================== -->

    <div class="status" id="status">

        <span class="dot"></span>

        جاري تحميل الأسعار...

    </div>


    <!-- =====================
         الذهب
    ====================== -->

    <div class="card">

        <div class="card-header">

            <div class="card-title">

                <div class="icon">
                    🥇
                </div>

                <div>

                    <h2>الذهب</h2>

                    <span>
                        سعر الذهب في السوق
                    </span>

                </div>

            </div>

        </div>


        <div class="price-row">

            <span class="price-label">
                شراء
            </span>

            <span class="price-value">

                <span id="goldBuy">
                    ---
                </span>

                <span class="currency">
                    جنيه
                </span>

            </span>

        </div>


        <div class="price-row">

            <span class="price-label">
                بيع
            </span>

            <span class="price-value">

                <span id="goldSell">
                    ---
                </span>

                <span class="currency">
                    جنيه
                </span>

            </span>

        </div>

    </div>


    <!-- =====================
         الدولار
    ====================== -->

    <div class="card">

        <div class="card-header">

            <div class="card-title">

                <div class="icon">
                    💵
                </div>

                <div>

                    <h2>الدولار الأمريكي</h2>

                    <span>
                        سعر الدولار مقابل الجنيه
                    </span>

                </div>

            </div>

        </div>


        <div class="price-row">

            <span class="price-label">
                شراء
            </span>

            <span class="price-value">

                <span id="dollarBuy">
                    ---
                </span>

                <span class="currency">
                    جنيه
                </span>

            </span>

        </div>


        <div class="price-row">

            <span class="price-label">
                بيع
            </span>

            <span class="price-value">

                <span id="dollarSell">
                    ---
                </span>

                <span class="currency">
                    جنيه
                </span>

            </span>

        </div>

    </div>


    <!-- =====================
         الوقود
    ====================== -->

    <div class="card">

        <div class="card-header">

            <div class="card-title">

                <div class="icon">
                    ⛽
                </div>

                <div>

                    <h2>الوقود</h2>

                    <span>
                        السعر الحالي
                    </span>

                </div>

            </div>

        </div>


        <div class="price-row">

            <span class="price-label">
                السعر
            </span>

            <span class="price-value">

                <span id="fuel">
                    ---
                </span>

                <span class="currency">
                    جنيه
                </span>

            </span>

        </div>

    </div>


    <!-- =====================
         آخر تحديث
    ====================== -->

    <div class="last-update">

        آخر تحديث:

        <strong id="lastUpdate">
            ---
        </strong>

    </div>


    <!-- =====================
         زر التحديث
    ====================== -->

    <button
        class="refresh-btn"
        id="refreshButton"
        onclick="loadPrices()">

        🔄 تحديث الأسعار

    </button>


    <!-- =====================
         الفوتر
    ====================== -->

    <div class="footer">

        بورصة نيالا © 2026

    </div>

</div>


<script>

/* =========================
   تحميل الأسعار
========================= */

async function loadPrices() {

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("refreshButton");


    button.classList.add("loading");

    button.textContent =
        "⏳ جاري التحديث...";


    status.innerHTML =
        "جاري تحميل الأسعار...";


    try {

        /*
         منع المتصفح من استخدام نسخة قديمة
        */

        const response =
            await fetch(
                "/prices.txt?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const text =
            await response.text();


        const lines =
            text.split(/\r?\n/);


        const prices = {};


        lines.forEach(
            function(line) {

                const index =
                    line.indexOf(":");


                if (index === -1) {
                    return;
                }


                const key =
                    line
                    .substring(0, index)
                    .trim();


                const value =
                    line
                    .substring(index + 1)
                    .trim();


                prices[key] =
                    value;

            }
        );


        /*
         تحديث الأسعار
        */

        document.getElementById(
            "goldBuy"
        ).textContent =
            prices["Gold BUY"] || "---";


        document.getElementById(
            "goldSell"
        ).textContent =
            prices["Gold SELL"] || "---";


        document.getElementById(
            "dollarBuy"
        ).textContent =
            prices["Dollar BUY"] || "---";


        document.getElementById(
            "dollarSell"
        ).textContent =
            prices["Dollar SELL"] || "---";


        document.getElementById(
            "fuel"
        ).textContent =
            prices["Fuel"] || "---";


        document.getElementById(
            "lastUpdate"
        ).textContent =
            prices["Last update"] || "---";


        status.innerHTML =
            '<span class="dot"></span> الأسعار محدثة';


    }

    catch (error) {

        console.error(error);


        status.innerHTML =
            "⚠️ تعذر تحميل الأسعار";


    }


    finally {

        button.classList.remove(
            "loading"
        );


        button.textContent =
            "🔄 تحديث الأسعار";

    }

}


/* =========================
   تحميل عند فتح الصفحة
========================= */

loadPrices();


/*
   تحديث تلقائي كل دقيقة
*/

setInterval(
    loadPrices,
    60000
);

</script>

</body>

</html>
