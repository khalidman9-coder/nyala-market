<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>سجل أسعار بورصة نيالا</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 14px;
    font-family: Arial, Tahoma, sans-serif;
    background: #f3f5f7;
    color: #17202a;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
}

.header {
    background: linear-gradient(135deg,#111827,#26364d);
    color: white;
    padding: 24px 18px;
    border-radius: 22px;
    margin-bottom: 15px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 25px;
}

.header p {
    margin: 8px 0 0;
    color: #d1d5db;
    font-size: 13px;
}

.summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 15px;
}

.summary-box {
    background: white;
    border-radius: 17px;
    padding: 16px;
    text-align: center;
}

.summary-title {
    color: #6b7280;
    font-size: 13px;
    margin-bottom: 8px;
}

.summary-value {
    font-size: 20px;
    font-weight: bold;
}

.record {
    background: white;
    border-radius: 19px;
    margin-bottom: 13px;
    padding: 17px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

.record-time {
    font-size: 13px;
    color: #6b7280;
    padding-bottom: 12px;
    margin-bottom: 8px;
    border-bottom: 1px solid #edf0f2;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #f1f3f5;
}

.row:last-child {
    border-bottom: none;
}

.label {
    color: #6b7280;
}

.value {
    font-weight: bold;
    font-size: 17px;
}

.empty {
    background: white;
    border-radius: 18px;
    padding: 30px;
    text-align: center;
    color: #777;
}

.refresh {
    width: 100%;
    border: none;
    background: #111827;
    color: white;
    padding: 14px;
    border-radius: 15px;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 15px;
}

.footer {
    text-align: center;
    color: #9ca3af;
    font-size: 11px;
    padding: 15px 0 25px;
}
</style>

</head>

<body>

<div class="container">

<div class="header">
    <h1>📊 سجل أسعار بورصة نيالا</h1>
    <p>تاريخ تغيرات أسعار السوق</p>
</div>

<div class="summary">

    <div class="summary-box">
        <div class="summary-title">
            عدد التحديثات
        </div>

        <div
            id="recordCount"
            class="summary-value">
            0
        </div>
    </div>

    <div class="summary-box">
        <div class="summary-title">
            آخر تحديث
        </div>

        <div
            id="lastRecord"
            class="summary-value">
            ---
        </div>
    </div>

</div>

<button
    class="refresh"
    onclick="loadHistory()">
    🔄 تحديث السجل
</button>

<div id="history">

    <div class="empty">
        جاري تحميل السجل...
    </div>

</div>

<div class="footer">
    بورصة نيالا © 2026
</div>

</div>


<script>

async function loadHistory() {

    const box =
        document.getElementById("history");

    try {

        const response =
            await fetch(
                "/history.txt?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const text =
            await response.text();

        const lines =
            text
            .split(/\r?\n/)
            .map(line => line.trim())
            .filter(line => line.length > 0);

        document.getElementById(
            "recordCount"
        ).textContent = lines.length;


        if (lines.length === 0) {

            box.innerHTML =
                '<div class="empty">' +
                'لا توجد تحديثات حتى الآن' +
                '</div>';

            return;
        }


        const latest =
            lines[lines.length - 1];

        const latestParts =
            latest.split(" | ");

        document.getElementById(
            "lastRecord"
        ).textContent =
            latestParts[0] || "---";


        box.innerHTML = "";


        lines.reverse().forEach(
            function(line) {

                const parts =
                    line.split(" | ");

                const time =
                    parts[0] || "---";

                let gold = "";
                let dollar = "";
                let diesel = "";
                let gasoline = "";


                parts.forEach(
                    function(part) {

                        if (
                            part.startsWith("Gold:")
                        ) {
                            gold =
                                part
                                .replace(
                                    "Gold:",
                                    ""
                                )
                                .trim();
                        }

                        if (
                            part.startsWith("Dollar:")
                        ) {
                            dollar =
                                part
                                .replace(
                                    "Dollar:",
                                    ""
                                )
                                .trim();
                        }

                        if (
                            part.startsWith("Diesel:")
                        ) {
                            diesel =
                                part
                                .replace(
                                    "Diesel:",
                                    ""
                                )
                                .trim();
                        }

                        if (
                            part.startsWith("Gasoline:")
                        ) {
                            gasoline =
                                part
                                .replace(
                                    "Gasoline:",
                                    ""
                                )
                                .trim();
                        }

                    }
                );


                const goldParts =
                    gold.split("/");

                const dollarParts =
                    dollar.split("/");


                const goldBuy =
                    goldParts[0] || "---";

                const goldSell =
                    goldParts[1] || "---";

                const dollarBuy =
                    dollarParts[0] || "---";

                const dollarSell =
                    dollarParts[1] || "---";


                const card =
                    document.createElement("div");

                card.className = "record";


                card.innerHTML = `

                    <div class="record-time">
                        🕐 ${time}
                    </div>

                    <div class="row">
                        <span class="label">
                            🥇 ذهب شراء
                        </span>

                        <span class="value">
                            ${goldBuy}
                        </span>
                    </div>

                    <div class="row">
                        <span class="label">
                            🥇 ذهب بيع
                        </span>

                        <span class="value">
                            ${goldSell}
                        </span>
                    </div>

                    <div class="row">
                        <span class="label">
                            💵 دولار شراء
                        </span>

                        <span class="value">
                            ${dollarBuy}
                        </span>
                    </div>

                    <div class="row">
                        <span class="label">
                            💵 دولار بيع
                        </span>

                        <span class="value">
                            ${dollarSell}
                        </span>
                    </div>

                    <div class="row">
                        <span class="label">
                            ⛽ ديزل
                        </span>

                        <span class="value">
                            ${diesel || "---"}
                        </span>
                    </div>

                    <div class="row">
                        <span class="label">
                            🚗 بنزين
                        </span>

                        <span class="value">
                            ${gasoline || "---"}
                        </span>
                    </div>

                `;

                box.appendChild(card);

            }
        );

    }

    catch (error) {

        console.error(error);

        box.innerHTML =
            '<div class="empty">' +
            'تعذر تحميل سجل الأسعار' +
            '</div>';
    }
}

loadHistory();

</script>

</body>
</html>
