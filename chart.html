<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تحليل السوق - بورصة نيالا</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 14px;
    font-family: Arial, Tahoma, sans-serif;
    background: #eef2f6;
    color: #17202a;
}

.container {
    max-width: 600px;
    margin: auto;
}

.header {
    background: linear-gradient(135deg, #111827, #1f2937);
    color: white;
    border-radius: 20px;
    padding: 22px 18px;
    text-align: center;
    margin-bottom: 12px;
}

.header h1 {
    margin: 0;
    font-size: 27px;
}

.header p {
    margin: 7px 0 0;
    color: #d1d5db;
    font-size: 13px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 12px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 3px 14px rgba(0,0,0,.06);
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-weight: bold;
    cursor: pointer;
    background: #111827;
    color: white;
}

button.active {
    background: #374151;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
}

.stat {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 10px 5px;
    text-align: center;
}

.stat small {
    display: block;
    color: #6b7280;
    font-size: 11px;
    margin-bottom: 5px;
}

.stat strong {
    font-size: 16px;
}

.chart-box {
    height: 340px;
}

.analysis-summary {
    margin-top: 12px;
    padding: 12px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 13px;
    text-align: center;
}

.change {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 5px;
}

.change-up {
    color: #15803d;
}

.change-down {
    color: #dc2626;
}

.change-flat {
    color: #6b7280;
}

.period {
    color: #6b7280;
    font-size: 12px;
}

.status {
    text-align: center;
    color: #6b7280;
    font-size: 12px;
    margin-top: 8px;
}

.back {
    display: block;
    text-align: center;
    text-decoration: none;
    background: white;
    color: #111827;
    border-radius: 13px;
    padding: 12px;
    margin-top: 12px;
    border: 1px solid #e5e7eb;
}

@media (max-width: 380px) {
    .stats {
        grid-template-columns: 1fr;
    }

    .chart-box {
        height: 280px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📈 تحليل السوق</h1>
        <p>تاريخ أسعار بورصة نيالا</p>
    </div>

    <div class="card">

        <div class="controls">

            <button
                id="goldBtn"
                onclick="selectMarket('gold')">
                🥇 الذهب
            </button>

            <button
                id="dollarBtn"
                onclick="selectMarket('dollar')">
                💵 الدولار
            </button>

            <button
                id="dieselBtn"
                onclick="selectMarket('diesel')">
                ⛽ الديزل
            </button>

            <button
                id="gasolineBtn"
                onclick="selectMarket('gasoline')">
                🚗 البنزين
            </button>

        </div>

    </div>

    <div class="card">

        <div class="controls">

            <button
                id="buyBtn"
                onclick="selectSide('buy')">
                شراء
            </button>

            <button
                id="sellBtn"
                onclick="selectSide('sell')">
                بيع
            </button>

        </div>

    </div>

    <div class="card">

        <div class="stats">

            <div class="stat">
                <small>آخر سعر</small>
                <strong id="currentPrice">---</strong>
            </div>

            <div class="stat">
                <small>أعلى سعر</small>
                <strong id="highPrice">---</strong>
            </div>

            <div class="stat">
                <small>أقل سعر</small>
                <strong id="lowPrice">---</strong>
            </div>

        </div>

        <div class="analysis-summary">

            <div
                id="changeValue"
                class="change change-flat">
                → 0%
            </div>

            <div
                id="periodText"
                class="period">
                الفترة: ---
            </div>

        </div>

    </div>

    <div class="card">

        <div class="chart-box">
            <canvas id="priceChart"></canvas>
        </div>

        <div
            id="status"
            class="status">
            جاري تحميل البيانات...
        </div>

    </div>

    <a
        href="/"
        class="back">
        ← العودة إلى الأسعار
    </a>

</div>

<script>

let historyData = [];
let selectedMarket = "gold";
let selectedSide = "buy";
let chart = null;


/* =========================
   تحليل سطر التاريخ
========================= */

function parseHistoryLine(line) {

    const match = line.match(
        /^(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2}:\d{2})\s+\|\s+Gold:\s+([^/]+)\/([^|]+)\s+\|\s+Dollar:\s+([^/]+)\/([^|]+)\s+\|\s+Diesel:\s+([^|]+)\s+\|\s+Gasoline:\s+(.+)$/
    );

    if (!match) {
        return null;
    }

    return {
        date: match[1],
        time: match[2],

        goldBuy: Number(match[3].trim()),
        goldSell: Number(match[4].trim()),

        dollarBuy: Number(match[5].trim()),
        dollarSell: Number(match[6].trim()),

        diesel: Number(match[7].trim()),
        gasoline: Number(match[8].trim())
    };
}


/* =========================
   تحميل التاريخ
========================= */

async function loadHistory() {

    const status =
        document.getElementById("status");

    try {

        const response =
            await fetch(
                "/history.txt?t=" + Date.now(),
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const text =
            await response.text();

        historyData =
            text
            .split(/\r?\n/)
            .map(parseHistoryLine)
            .filter(Boolean);

        if (!historyData.length) {
            throw new Error(
                "لا توجد بيانات تاريخية"
            );
        }

        updateChart();

        status.textContent =
            "تم تحميل " +
            historyData.length +
            " تحديث";

    } catch (error) {

        console.error(error);

        status.textContent =
            "تعذر تحميل التاريخ";
    }
}


/* =========================
   اختيار السوق
========================= */

function selectMarket(market) {

    selectedMarket = market;

    updateChart();
}


/* =========================
   اختيار شراء / بيع
========================= */

function selectSide(side) {

    selectedSide = side;

    updateChart();
}


/* =========================
   الحصول على البيانات
========================= */

function getValues() {

    return historyData.map(
        function(item) {

            if (selectedMarket === "gold") {
                return selectedSide === "buy"
                    ? item.goldBuy
                    : item.goldSell;
            }

            if (selectedMarket === "dollar") {
                return selectedSide === "buy"
                    ? item.dollarBuy
                    : item.dollarSell;
            }

            if (selectedMarket === "diesel") {
                return item.diesel;
            }

            return item.gasoline;
        }
    );
}


/* =========================
   اسم السوق
========================= */

function getMarketName() {

    if (selectedMarket === "gold") {
        return "الذهب";
    }

    if (selectedMarket === "dollar") {
        return "الدولار";
    }

    if (selectedMarket === "diesel") {
        return "الديزل";
    }

    return "البنزين";
}


/* =========================
   تحديث الرسم
========================= */

function updateChart() {

    if (!historyData.length) {
        return;
    }

    const labels =
        historyData.map(
            item =>
                item.date.substring(5) +
                " " +
                item.time.substring(0, 5)
        );

    const values =
        getValues();

    const current =
        values[values.length - 1];

    const first =
        values[0];

    const high =
        Math.max(...values);

    const low =
        Math.min(...values);

    const difference =
        current - first;

    const percent =
        first !== 0
            ? (difference / first) * 100
            : 0;

    const changeEl =
        document.getElementById("changeValue");

    if (changeEl) {

        changeEl.classList.remove(
            "change-up",
            "change-down",
            "change-flat"
        );

        if (difference > 0) {

            changeEl.textContent =
                "↑ +" +
                difference +
                " (" +
                percent.toFixed(2) +
                "%)";

            changeEl.classList.add(
                "change-up"
            );

        } else if (difference < 0) {

            changeEl.textContent =
                "↓ " +
                difference +
                " (" +
                percent.toFixed(2) +
                "%)";

            changeEl.classList.add(
                "change-down"
            );

        } else {

            changeEl.textContent =
                "→ 0%";

            changeEl.classList.add(
                "change-flat"
            );
        }
    }

    const periodEl =
        document.getElementById("periodText");

    if (periodEl) {

        periodEl.textContent =
            "الفترة: " +
            historyData[0].date +
            " " +
            historyData[0].time.substring(0, 5) +
            " → " +
            historyData[historyData.length - 1].date +
            " " +
            historyData[historyData.length - 1].time.substring(0, 5);
    }

    document.getElementById(
        "currentPrice"
    ).textContent = current;

    document.getElementById(
        "highPrice"
    ).textContent = high;

    document.getElementById(
        "lowPrice"
    ).textContent = low;

    document.getElementById(
        "goldBtn"
    ).classList.toggle(
        "active",
        selectedMarket === "gold"
    );

    document.getElementById(
        "dollarBtn"
    ).classList.toggle(
        "active",
        selectedMarket === "dollar"
    );

    document.getElementById(
        "dieselBtn"
    ).classList.toggle(
        "active",
        selectedMarket === "diesel"
    );

    document.getElementById(
        "gasolineBtn"
    ).classList.toggle(
        "active",
        selectedMarket === "gasoline"
    );

    document.getElementById(
        "buyBtn"
    ).classList.toggle(
        "active",
        selectedSide === "buy"
    );

    document.getElementById(
        "sellBtn"
    ).classList.toggle(
        "active",
        selectedSide === "sell"
    );

    const ctx =
        document
        .getElementById("priceChart")
        .getContext("2d");

    if (chart) {
        chart.destroy();
    }

    chart =
        new Chart(
            ctx,
            {
                type: "line",

                data: {
                    labels: labels,

                    datasets: [
                        {
                            label:
                                getMarketName(),

                            data: values,

                            borderWidth: 2,

                            tension: 0.25,

                            pointRadius: 3,

                            fill: false
                        }
                    ]
                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    plugins: {

                        legend: {
                            display: true
                        }

                    },

                    scales: {

                        y: {
                            beginAtZero: false
                        }

                    }

                }
            }
        );
}

loadHistory();

setInterval(
    loadHistory,
    30000
);

</script>

</body>
</html>
