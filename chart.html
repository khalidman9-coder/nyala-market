<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>تحليل أسعار بورصة نيالا</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 14px;
    background: #f3f4f6;
    color: #111827;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1000px;
    margin: auto;
}

.header {
    background: #111827;
    color: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 15px;
}

.header h1 {
    margin: 0 0 7px;
    font-size: 24px;
}

.header p {
    margin: 0;
    opacity: .8;
}

.controls {
    background: white;
    padding: 15px;
    border-radius: 14px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.controls label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 16px;
    background: white;
}

.chart-box {
    background: white;
    padding: 15px;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

canvas {
    width: 100% !important;
    height: 420px !important;
}

.status {
    margin-top: 12px;
    text-align: center;
    color: #6b7280;
    font-size: 14px;
}

.back {
    display: inline-block;
    margin-top: 15px;
    text-decoration: none;
    background: #111827;
    color: white;
    padding: 10px 16px;
    border-radius: 9px;
}

@media (max-width: 600px) {
    body {
        padding: 9px;
    }

    .header h1 {
        font-size: 20px;
    }

    canvas {
        height: 340px !important;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📊 تحليل أسعار بورصة نيالا</h1>
        <p>متابعة حركة الأسعار المسجلة عبر الزمن</p>
    </div>

    <div class="controls">

        <label for="marketSelect">
            اختر السعر المراد تحليله
        </label>

        <select id="marketSelect">
            <option value="gold">🥇 الذهب</option>
            <option value="dollar">💵 الدولار</option>
            <option value="diesel">⛽ الديزل</option>
            <option value="gasoline">🚗 البنزين</option>
        </select>

    </div>

    <div class="chart-box">

        <canvas id="priceChart"></canvas>

        <div class="status" id="status">
            جارٍ تحميل البيانات...
        </div>

    </div>

    <a class="back" href="/">
        العودة إلى الصفحة الرئيسية
    </a>

</div>

<script>

let historyData = [];
let chart = null;

const select = document.getElementById("marketSelect");
const statusBox = document.getElementById("status");

async function loadHistory() {

    try {

        const response = await fetch(
            "/history.txt?time=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const text = await response.text();

        historyData = parseHistory(text);

        if (!historyData.length) {

            statusBox.textContent =
                "لا توجد بيانات تاريخية حتى الآن";

            return;
        }

        drawChart();

    } catch (error) {

        console.error(error);

        statusBox.textContent =
            "حدث خطأ أثناء تحميل بيانات الأسعار";

    }

}


function parseHistory(text) {

    const lines = text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.length > 0);

    const result = [];

    for (const line of lines) {

        const match = line.match(
            /^(.+?)\s+\|\s+Gold:\s*([\d.]+)\/([\d.]+)\s+\|\s+Dollar:\s*([\d.]+)\/([\d.]+)\s+\|\s+Diesel:\s*([\d.]+)\s+\|\s+Gasoline:\s*([\d.]+)/
        );

        if (!match) {
            continue;
        }

        result.push({

            time: match[1],

            goldBuy: Number(match[2]),
            goldSell: Number(match[3]),

            dollarBuy: Number(match[4]),
            dollarSell: Number(match[5]),

            diesel: Number(match[6]),
            gasoline: Number(match[7])

        });

    }

    return result;
}


function drawChart() {

    const type = select.value;

    let labels = [];
    let datasets = [];

    if (type === "gold") {

        labels = historyData.map(item => item.time);

        datasets = [

            {
                label: "الذهب شراء",
                data: historyData.map(item => item.goldBuy),
                tension: 0.25
            },

            {
                label: "الذهب بيع",
                data: historyData.map(item => item.goldSell),
                tension: 0.25
            }

        ];

    }


    if (type === "dollar") {

        labels = historyData.map(item => item.time);

        datasets = [

            {
                label: "الدولار شراء",
                data: historyData.map(item => item.dollarBuy),
                tension: 0.25
            },

            {
                label: "الدولار بيع",
                data: historyData.map(item => item.dollarSell),
                tension: 0.25
            }

        ];

    }


    if (type === "diesel") {

        labels = historyData.map(item => item.time);

        datasets = [

            {
                label: "الديزل",
                data: historyData.map(item => item.diesel),
                tension: 0.25
            }

        ];

    }


    if (type === "gasoline") {

        labels = historyData.map(item => item.time);

        datasets = [

            {
                label: "البنزين",
                data: historyData.map(item => item.gasoline),
                tension: 0.25
            }

        ];

    }


    if (chart) {
        chart.destroy();
    }


    const ctx =
        document.getElementById("priceChart")
        .getContext("2d");


    chart = new Chart(ctx, {

        type: "line",

        data: {
            labels: labels,
            datasets: datasets
        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            interaction: {
                mode: "index",
                intersect: false
            },

            plugins: {

                legend: {
                    display: true,
                    position: "top"
                },

                tooltip: {
                    callbacks: {

                        title: function(items) {

                            return items[0].label;

                        },

                        label: function(context) {

                            return (
                                context.dataset.label +
                                ": " +
                                context.parsed.y
                            );

                        }

                    }
                }

            },

            scales: {

                x: {

                    ticks: {
                        maxRotation: 45,
                        minRotation: 0
                    }

                },

                y: {

                    beginAtZero: false

                }

            }

        }

    });


    statusBox.textContent =
        "عدد التحديثات المسجلة: " +
        historyData.length;

}


select.addEventListener(
    "change",
    drawChart
);


loadHistory();

</script>

</body>
</html>
