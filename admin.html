<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>إدارة بورصة نيالا</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, Tahoma, sans-serif;
    background: #f3f5f7;
    color: #17202a;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
}

.header {
    background: linear-gradient(135deg, #111827, #26364d);
    color: white;
    padding: 23px 18px;
    border-radius: 22px;
    margin-bottom: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.header p {
    margin: 7px 0 0;
    color: #d1d5db;
    font-size: 13px;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 4px 18px rgba(0,0,0,.07);
}

.title {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #6b7280;
    font-size: 13px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d9dee5;
    border-radius: 13px;
    font-size: 16px;
    margin-bottom: 14px;
    outline: none;
    background: #fafafa;
}

input:focus {
    border-color: #111827;
    background: white;
}

button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn {
    background: #111827;
    color: white;
}

.update-btn {
    background: #15803d;
    color: white;
    margin-top: 5px;
}

.logout-btn {
    background: #f3f4f6;
    color: #374151;
    margin-top: 10px;
}

.status {
    text-align: center;
    padding: 12px;
    border-radius: 13px;
    margin-bottom: 15px;
    font-size: 14px;
    display: none;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.price-section {
    display: none;
}

.price-group {
    border: 1px solid #edf0f2;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 13px;
}

.price-group-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 13px;
}

.footer {
    text-align: center;
    color: #9ca3af;
    font-size: 11px;
    padding: 15px 0 25px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

    <h1>⚙️ إدارة بورصة نيالا</h1>

    <p>
        لوحة التحكم في أسعار السوق
    </p>

</div>


<div id="status"
     class="status">
</div>


<!-- تسجيل الدخول -->

<div id="loginSection"
     class="card">

    <div class="title">
        🔐 تسجيل الدخول
    </div>

    <label>
        اسم المستخدم
    </label>

    <input
        id="username"
        type="text"
        autocomplete="username"
        placeholder="اسم المستخدم">


    <label>
        كلمة المرور
    </label>

    <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="كلمة المرور">


    <button
        class="login-btn"
        onclick="login()">

        دخول

    </button>

</div>


<!-- لوحة الأسعار -->

<div id="priceSection"
     class="price-section">


    <div class="card">

        <div class="title">
            📊 تحديث أسعار السوق
        </div>


        <!-- الذهب -->

        <div class="price-group">

            <div class="price-group-title">
                🥇 الذهب
            </div>

            <label>
                سعر الشراء
            </label>

            <input
                id="goldBuy"
                type="text"
                inputmode="decimal"
                placeholder="مثال: 4350">


            <label>
                سعر البيع
            </label>

            <input
                id="goldSell"
                type="text"
                inputmode="decimal"
                placeholder="مثال: 4370">

        </div>


        <!-- الدولار -->

        <div class="price-group">

            <div class="price-group-title">
                💵 الدولار
            </div>

            <label>
                سعر الشراء
            </label>

            <input
                id="dollarBuy"
                type="text"
                inputmode="decimal"
                placeholder="مثال: 4250">


            <label>
                سعر البيع
            </label>

            <input
                id="dollarSell"
                type="text"
                inputmode="decimal"
                placeholder="مثال: 4280">

        </div>


        <!-- الديزل -->

        <div class="price-group">

            <div class="price-group-title">
                ⛽ الديزل
            </div>

            <label>
                سعر الديزل
            </label>

            <input
                id="diesel"
                type="text"
                inputmode="decimal"
                placeholder="مثال: 1400">

        </div>


        <!-- البنزين -->

        <div class="price-group">

            <div class="price-group-title">
                🚗 البنزين
            </div>

            <label>
                سعر البنزين
            </label>

            <input
                id="gasoline"
                type="text"
                inputmode="decimal"
                placeholder="مثال: 1600">

        </div>


        <button
            class="update-btn"
            onclick="updatePrices()">

            💾 تحديث الأسعار

        </button>


        <button
            class="logout-btn"
            onclick="logout()">

            تسجيل الخروج

        </button>

    </div>

</div>


<div class="footer">

    بورصة نيالا © 2026

</div>

</div>


<script>

let loggedIn = false;


/* =========================
   الرسائل
========================= */

function showStatus(
    message,
    type
) {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        message;

    status.className =
        "status " + type;

    status.style.display =
        "block";
}


/* =========================
   تسجيل الدخول
========================= */

function login() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;


    if (!username || !password) {

        showStatus(
            "أدخل اسم المستخدم وكلمة المرور",
            "error"
        );

        return;
    }


    sessionStorage.setItem(
        "nyala_username",
        username
    );

    sessionStorage.setItem(
        "nyala_password",
        password
    );


    loggedIn = true;


    document.getElementById(
        "loginSection"
    ).style.display =
        "none";


    document.getElementById(
        "priceSection"
    ).style.display =
        "block";


    showStatus(
        "تم تسجيل الدخول",
        "success"
    );


    loadCurrentPrices();
}


/* =========================
   تحميل الأسعار الحالية
========================= */

async function loadCurrentPrices() {

    try {

        const response =
            await fetch(
                "/prices.txt?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {
            return;
        }


        const text =
            await response.text();


        const lines =
            text.split(/\r?\n/);


        const prices = {};


        lines.forEach(
            function(line) {

                const index =
                    line.indexOf(":");


                if (index === -1) {
                    return;
                }


                const key =
                    line
                    .substring(
                        0,
                        index
                    )
                    .trim();


                const value =
                    line
                    .substring(
                        index + 1
                    )
                    .trim();


                prices[key] =
                    value;

            }
        );


        document.getElementById(
            "goldBuy"
        ).value =
            prices["Gold BUY"] || "";


        document.getElementById(
            "goldSell"
        ).value =
            prices["Gold SELL"] || "";


        document.getElementById(
            "dollarBuy"
        ).value =
            prices["Dollar BUY"] || "";


        document.getElementById(
            "dollarSell"
        ).value =
            prices["Dollar SELL"] || "";


        document.getElementById(
            "diesel"
        ).value =
            prices["Diesel"] || "";


        document.getElementById(
            "gasoline"
        ).value =
            prices["Gasoline"] || "";

    }

    catch (error) {

        console.error(error);

    }
}


/* =========================
   تحديث الأسعار
========================= */

async function updatePrices() {

    if (!loggedIn) {

        showStatus(
            "يجب تسجيل الدخول أولاً",
            "error"
        );

        return;
    }


    const goldBuy =
        document.getElementById(
            "goldBuy"
        ).value.trim();


    const goldSell =
        document.getElementById(
            "goldSell"
        ).value.trim();


    const dollarBuy =
        document.getElementById(
            "dollarBuy"
        ).value.trim();


    const dollarSell =
        document.getElementById(
            "dollarSell"
        ).value.trim();


    const diesel =
        document.getElementById(
            "diesel"
        ).value.trim();


    const gasoline =
        document.getElementById(
            "gasoline"
        ).value.trim();


    if (
        !goldBuy ||
        !goldSell ||
        !dollarBuy ||
        !dollarSell ||
        !diesel ||
        !gasoline
    ) {

        showStatus(
            "أكمل جميع الأسعار",
            "error"
        );

        return;
    }


    const username =
        sessionStorage.getItem(
            "nyala_username"
        );


    const password =
        sessionStorage.getItem(
            "nyala_password"
        );


    const data = {

        goldBuy:
            goldBuy,

        goldSell:
            goldSell,

        dollarBuy:
            dollarBuy,

        dollarSell:
            dollarSell,

        diesel:
            diesel,

        gasoline:
            gasoline
    };


    try {

        showStatus(
            "جاري تحديث الأسعار...",
            "success"
        );


        const response =
            await fetch(
                "/update",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-Username":
                            username,

                        "X-Password":
                            password
                    },

                    body:
                        JSON.stringify(
                            data
                        )
                }
            );


        const result =
            await response.text();


        if (
            response.status === 403
        ) {

            showStatus(
                "بيانات الدخول غير صحيحة",
                "error"
            );

            return;
        }


        if (!response.ok) {

            showStatus(
                "فشل تحديث الأسعار: " +
                result,
                "error"
            );

            return;
        }


        showStatus(
            "✅ تم تحديث الأسعار بنجاح",
            "success"
        );


    }

    catch (error) {

        console.error(error);

        showStatus(
            "تعذر الاتصال بالخادم",
            "error"
        );
    }
}


/* =========================
   تسجيل الخروج
========================= */

function logout() {

    sessionStorage.removeItem(
        "nyala_username"
    );

    sessionStorage.removeItem(
        "nyala_password"
    );


    loggedIn = false;


    document.getElementById(
        "loginSection"
    ).style.display =
        "block";


    document.getElementById(
        "priceSection"
    ).style.display =
        "none";


    document.getElementById(
        "username"
    ).value =
        "";


    document.getElementById(
        "password"
    ).value =
        "";


    showStatus(
        "تم تسجيل الخروج",
        "success"
    );
}

</script>

</body>

</html>
